name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install SDK inventory helper prerequisite
        run: |
          # Official release, pinned by version and publisher SHA-256.
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" ripgrep-14.1.0-x86_64-unknown-linux-musl/rg
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg" "$RUNNER_TEMP/bin/rg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run audit:runtime
      - run: npm run check
      - run: git diff --exit-code -- dist/gui-experimental.cjs dist/tui.js
      - run: npm run pack:check
      - run: npm run setup:local
      - run: npm run test:host
      - run: npm run release:artifact
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: .runtime/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  runtime-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.20.0', '24.22.1', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install SDK inventory helper prerequisite
        run: |
          # Official release, pinned by version and publisher SHA-256.
          test "$(uname -m)" = x86_64
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" ripgrep-14.1.0-x86_64-unknown-linux-musl/rg
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg" "$RUNNER_TEMP/bin/rg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run test:runtime
