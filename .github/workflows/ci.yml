name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:runtime
      - run: npm run check
      - run: git diff --exit-code -- dist/gui-experimental.cjs dist/tui.js
      - run: npm run pack:check
      - run: npm run setup:local
      - run: npm run test:host
      - run: npm run test:plan-host
      - run: npm run release:artifact
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.sha }}
          path: .runtime/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
